<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23d6b35f' stroke='%236b4218' stroke-width='4'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='serif' font-size='19' font-weight='700' fill='%23b81515'%3EXQ%3C/text%3E%3C/svg%3E" />
  <link rel="preload" href="./pikafish.js" as="script" />
  <!-- Installable, because this is a board people use on a phone: launched from
       the home screen it opens standalone, and the vertical space the browser
       chrome gives back is space the board gets. `start_url` and `scope` are
       relative so they resolve against the manifest wherever it is served from,
       which is a /web-xiangqi/ subpath in production and the root in the demo.
       The icons are SVG rather than a ladder of PNGs, with a separate maskable
       one because a platform may crop to a circle and only the middle 80% of an
       icon is guaranteed to survive. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
       values; without it they resolve to 0 and the safe-area padding on the top
       bar, bottom panel, mobile tab bar and modals never takes effect. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A fast Xiangqi analysis board with Pikafish engine lines, game review, openings, saved studies, PGN/FEN import, and shareable variations." />
  <meta name="application-name" content="Web Xiangqi" />
  <meta name="apple-mobile-web-app-title" content="Web Xiangqi" />
  <!-- Safari does not read the manifest's `display`; this is what makes an
       iOS home-screen launch standalone. `black` rather than
       `black-translucent`, which would push the page up under the status bar
       and is a layout change this has not been tested on a device for. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050505" />
  <meta property="og:title" content="Web Xiangqi" />
  <meta property="og:description" content="Analyze Xiangqi with Pikafish engine lines, game review, opening continuations, saved studies, and shareable variations." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Web Xiangqi" />
  <meta name="twitter:description" content="A fast browser Xiangqi analysis board powered by Pikafish." />
  <title>Web Xiangqi | Pikafish Analysis Board</title>
  <!-- Cross-origin isolation, on a host that will not send the headers itself.

       The threaded Pikafish core needs SharedArrayBuffer, which a browser only
       grants a cross-origin isolated page. vite.config.ts sends COOP/COEP, so
       this is a no-op in development and in every browser check here. GitHub
       Pages sends neither and cannot be configured to, so on the deployed site
       ./coi-sw.js adds them and this reloads once to pick them up. Measured
       there: 479k nodes/second single-threaded, 3.9M with the worker.

       Inline and in <head> so the reload happens before React renders rather
       than after a board is already on screen. Every branch fails safe: no
       worker support, an insecure context, a rejected registration or a worker
       that never controls the page all leave the app exactly as it was --
       single-threaded, and working. -->
  <script>
    (function () {
      // Already isolated (the dev server, or a host that sends the headers):
      // there is nothing to add and no reason to install a worker.
      if (window.crossOriginIsolated) return;
      if (!window.isSecureContext) return;
      if (!('serviceWorker' in navigator)) return;

      var WORKER = 'coi-sw.js';
      var RELOADED = 'web-xiangqi:coi-reload';

      function isOurs(worker) {
        return Boolean(worker && worker.scriptURL && worker.scriptURL.indexOf(WORKER) !== -1);
      }

      // At most one reload per tab, whatever happens. If a reload somehow does
      // not isolate the page, this must not become a refresh loop -- the app is
      // usable either way, and a loop would make it unusable.
      function reloadOnce() {
        if (window.crossOriginIsolated) return;
        try {
          if (sessionStorage.getItem(RELOADED)) return;
          sessionStorage.setItem(RELOADED, '1');
        } catch (e) { return; }
        window.location.reload();
      }

      navigator.serviceWorker.register('./' + WORKER)
        .then(function () {
          // Reload only once *our* worker is the controller, never merely once
          // some worker is. Waiting on navigator.serviceWorker.ready instead
          // looks equivalent and is not: a returning visitor still carrying the
          // old demo worker has an active registration already, so `ready`
          // resolves on that one, the reload happens before this worker has
          // taken over, the second document is fetched without headers too, and
          // the one-shot guard above then blocks the reload that would have
          // worked. The site stays single-threaded forever, for no visible
          // reason. Only the controller says the next fetch goes through us.
          if (isOurs(navigator.serviceWorker.controller)) {
            reloadOnce();
            return;
          }
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (isOurs(navigator.serviceWorker.controller)) reloadOnce();
          });
        })
        .catch(function () { /* stays single-threaded, which is the old behaviour */ });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
