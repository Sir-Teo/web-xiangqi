<!-- Maskable: the platform may crop this to a circle, a squircle or a rounded
     square, and only the middle 80% is guaranteed to survive. The disc is drawn
     smaller and the background bleeds to every edge, so no crop can cut a
     corner off the piece or leave a transparent wedge behind it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Web Xiangqi">
  <rect width="64" height="64" fill="#050505"/>
  <circle cx="32" cy="32" r="17" fill="#d6b35f" stroke="#6b4218" stroke-width="3"/>
  <text x="32" y="38" text-anchor="middle" font-family="serif" font-size="15" font-weight="700" fill="#b81515">XQ</text>
</svg>
