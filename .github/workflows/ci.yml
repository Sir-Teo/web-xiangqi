name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMSDK_VERSION: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        run: npm ci

      - name: React app checks
        run: |
          npm audit --audit-level=moderate
          npm run lint
          npm run test:openings
          npm run test:library
          npm run test:serve-demo
          npm run build:react

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/install-emsdk.sh') }}

      - name: Install emsdk
        run: bash scripts/install-emsdk.sh

      - name: Build WASM demo
        run: npm run build

      - name: Node parity and smoke tests
        run: |
          npm run test:parity
          npm run test:review:parity
          npm run test:smoke:all

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.52.0

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Browser worker parity (quick)
        run: |
          npm run test:review:fixtures
          npm run test:ui:layout
          npm run test:worker-parity:browser
