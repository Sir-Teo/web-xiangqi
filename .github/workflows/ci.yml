name: CI

# Pull requests, and pushes to main.
#
# `push` was unrestricted here once, which fired alongside `pull_request` for
# the same branch and ran this job twice per change; scoping it to main fixes
# that -- a pull request gets one run, and the merge gets a separate run on
# different content.
#
# The comment this replaces said a push to main was "already covered by the
# deploy workflow, which runs the same gates". That was false, and it is the
# gap this trigger closes: the deploy runs audit, lint, unit tests and the
# build, but no deploy in any of the three sibling repos runs a browser suite.
# Those live only here, so without a push trigger nothing browser-level ever
# ran against main.
#
# This workflow deploys nothing. If it goes red the site still publishes, which
# is the reason the browser suites belong here rather than in the deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight. This is the
# longest job of the three repos — it installs emsdk, builds the WASM and drives
# a browser — so it is the one that most needs not to queue behind itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMSDK_VERSION: 6.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        run: npm ci

      - name: React app checks
        run: |
          npm run audit
          npm run lint
          npm test
          npm run test:openings
          npm run test:library
          npm run build:react

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/install-emsdk.sh') }}

      - name: Install emsdk
        run: bash scripts/install-emsdk.sh

      - name: Build WASM demo
        run: npm run build

      # Static, so it runs where the browser suites cannot: it reads the
      # artifacts that were just built and checks them against what
      # templates/pikafish.js and analysisProfile.ts assume. This is the only
      # gate that sees a toolchain silently dropping a Module key the wrapper
      # depends on -- Node never takes the worker path, the browser suite below
      # is single-threaded, and a release build says nothing.
      - name: Engine artifact contract
        run: npm run test:engine:contract

      - name: Node parity and smoke tests
        run: |
          npm run test:parity
          npm run test:review:parity
          npm run test:smoke:all
          npm run test:bench:quick

      # Playwright has to be installed before anything that drives a browser.
      # test:serve-demo does, and used to run in the step below this one — so it
      # failed on "Executable doesn't exist" every time, before the install had
      # happened. Caching does not save it either: the restore also came after.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Rebuild React app with fresh WASM
        run: |
          npm run build:react
          npm run test:serve-demo

      # The bundle that gets uploaded is otherwise the one thing no check loads:
      # every browser suite here drives the *dev* server. Shallow on purpose --
      # does the shell paint, does the engine reach ready from base-relative
      # URLs, did anything throw.
      - name: Production build smoke
        run: npm run test:prod:smoke

      - name: Browser worker parity (quick)
        # Single-threaded in the browser. The threaded build initialises fine in
        # Node here — the smoke test above runs it — and fine in a browser
        # locally, but the worker never reports ready on a runner and init times
        # out. Raising the limit to 240s and giving Chromium a real /dev/shm
        # both made no difference, so it is the threaded browser path itself.
        # Threaded stays covered by test:smoke; this covers the worker protocol.
        env:
          PIKAFISH_BROWSER_VARIANT: single
        run: |
          npm run test:review:fixtures
          npm run test:review:browser
          npm run test:ui:layout
          npm run test:worker-parity:browser
