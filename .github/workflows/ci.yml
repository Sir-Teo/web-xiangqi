name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: App and build-script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Check application and build configuration
        run: |
          npm run audit
          npm run typecheck
          npm run lint
          npm test
          npm run test:openings
          npm run test:library
          npm run test:build:publication
          node --test scripts/test-ui-audit-shards.cjs

  build:
    name: Build application once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMSDK_VERSION: 6.0.1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      # Exact hits only: never substitute an engine built with other sources,
      # flags, weights, wrapper or toolchain. Save before the browser jobs so a
      # test failure does not throw away a successful four-flavor compilation.
      - name: Restore compiled engine
        id: engine
        uses: actions/cache/restore@v5
        with:
          path: .cache/engine
          key: engine-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build-pikafish.sh', 'scripts/install-emsdk.sh', 'templates/**', 'patches/**', 'public/pikafish.nnue') }}
      - name: Cache emsdk on cold engine builds
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/install-emsdk.sh') }}
      - name: Compile all engine variants on cache miss
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          bash scripts/install-emsdk.sh
          npm run build
          mkdir -p .cache/engine
          cp dist/pikafish* .cache/engine/
      - name: Assemble engine and demo files
        run: |
          mkdir -p dist
          cp .cache/engine/* dist/
          cp .cache/engine/* public/
          cp demo/*.html dist/
          printf '%s\n' '{"type":"commonjs"}' > dist/package.json
          npm run test:engine:contract
      - name: Save verified engine cache
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/engine
          key: ${{ steps.engine.outputs.cache-primary-key }}
      - name: Build React application
        run: npm run build:react
      - name: Share application with all test and deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: dist
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  node:
    name: Engine parity and server contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/restore-build
      - run: |
          npm run test:engine:contract
          npm run test:parity
          npm run test:review:parity
          npm run test:smoke:all
          npm run test:bench:quick
          npm run test:server:headers

  browser:
    name: Browser ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: audit-1, command: 'npm run test:ui:audit -- --shard=1/8' }
          - { label: audit-2, command: 'npm run test:ui:audit -- --shard=2/8' }
          - { label: audit-3, command: 'npm run test:ui:audit -- --shard=3/8' }
          - { label: audit-4, command: 'npm run test:ui:audit -- --shard=4/8' }
          - { label: audit-5, command: 'npm run test:ui:audit -- --shard=5/8' }
          - { label: audit-6, command: 'npm run test:ui:audit -- --shard=6/8' }
          - { label: audit-7, command: 'npm run test:ui:audit -- --shard=7/8' }
          - { label: audit-8, command: 'npm run test:ui:audit -- --shard=8/8' }
          - { label: layout-1, command: 'npm run test:ui:layout -- --shard=1/4' }
          - { label: layout-2, command: 'npm run test:ui:layout -- --shard=2/4' }
          - { label: layout-3, command: 'npm run test:ui:layout -- --shard=3/4' }
          - { label: layout-4, command: 'npm run test:ui:layout -- --shard=4/4' }
          - { label: review-fixtures, command: 'npm run test:review:fixtures' }
          - { label: review, command: 'npm run test:review:browser' }
          - { label: review-calibration, command: 'npm run test:review:calibration' }
          - { label: worker, command: 'npm run test:worker-parity:browser' }
          - { label: production, command: 'npm run test:prod:smoke' }
          - { label: server, command: 'npm run test:serve-demo' }
    env:
      PIKAFISH_BROWSER_VARIANT: single
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/restore-build
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks
        run: ${{ matrix.command }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.label }}
          path: |
            .cache/ui-audit-*.json
            .cache/ui-layout-*.json
            /tmp/xiangqi-*.png
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: verify
    if: always()
    needs: [checks, build, node, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  deploy:
    name: Deploy verified build
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
