name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/install-emsdk.sh') }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Install emsdk
        run: bash scripts/install-emsdk.sh

      - name: Build WASM engine
        run: npm run build

      # The gates, before publishing rather than beside it. This workflow used
      # to go straight from the build to the upload: a red suite deployed, and
      # CI turned red afterwards. ci.yml runs on pull requests and is not
      # upstream of this job, so nothing here waited for it.
      #
      # verify is typecheck -> lint -> tests -> openings -> library -> engine
      # smoke -> parity -> build:react, chained so the first failure stops it,
      # and it ends with the React build this job uploads. The browser suites
      # (Playwright layout, worker parity, bench) stay in ci.yml: they need a
      # Chromium install and add minutes to every deploy for coverage a pull
      # request has already exercised.
      - name: Verify
        run: npm run verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
